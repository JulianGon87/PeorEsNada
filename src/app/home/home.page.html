<app-page-header titulo="Publicaciones"></app-page-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Publicaciones</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="manejarRefresco($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <app-publicacion-list 
    [publicaciones]="publicaciones" 
    (eliminar)="confirmarEliminacion($event)">
  </app-publicacion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button routerLink="/publicacion-add">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
